<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가족여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1f2f4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족여행">
<meta property="og:title" content="가족여행">
<meta property="og:description" content="우리 가족 여행 일정·동선·예산·준비물을 한눈에">
<meta property="og:type" content="website">
<meta property="og:site_name" content="가족여행">
<meta property="og:url" content="https://fuzzword0z-hue.github.io/travel/">
<meta property="og:image" content="https://fuzzword0z-hue.github.io/travel/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="여행 가방과 비행기, 가족 이모지">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fuzzword0z-hue.github.io/travel/og-image.jpg">
<meta name="description" content="우리 가족 여행 일정·동선·예산·준비물을 한눈에">
<style>
/* 가족여행 허브 — 여행편 카드 목록. 각 여행편 페이지와 같은 색 토큰을 써요 */
:root{
  color-scheme: light;
  --bg:#f6f3ee; --surface:#ffffff; --surface-2:#f1ece4; --line:#e4ddd2;
  --text:#1d1b19; --text-2:#5f5a54; --text-3:#8d867d;
  --accent:#c8452f; --accent-soft:#fbe9e4; --navy:#1f2f4d; --navy-soft:#e7ecf5;
  --ok:#2f7d4f; --ok-soft:#e3f2e8;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 4px 16px rgba(30,25,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141311; --surface:#1d1c1a; --surface-2:#262421; --line:#34312d;
    --text:#f1ede7; --text-2:#b7b0a6; --text-3:#857e74;
    --accent:#ee6a52; --accent-soft:#3a221d; --navy:#9fb4dc; --navy-soft:#1f2635;
    --ok:#5fc187; --ok-soft:#1c2e23; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141311; --surface:#1d1c1a; --surface-2:#262421; --line:#34312d;
  --text:#f1ede7; --text-2:#b7b0a6; --text-3:#857e74;
  --accent:#ee6a52; --accent-soft:#3a221d; --navy:#9fb4dc; --navy-soft:#1f2635;
  --ok:#5fc187; --ok-soft:#1c2e23; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:880px;margin:0 auto;padding-block:0 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.hero{padding:36px 0 8px;position:relative}
.hero .eyebrow{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.08em}
.hero h1{font-size:34px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--text-2)}
.faces{font-size:30px;margin-top:12px;letter-spacing:2px}
.theme-btn{position:absolute;right:0;top:36px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.next{margin-top:18px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--navy);color:var(--bg);text-decoration:none}
.next .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.next .t{font-size:13.5px;opacity:.9}
.next .t b{display:block;font-size:15px;opacity:1}
.next .go{margin-left:auto;font-weight:800}
.sec{font-size:15px;color:var(--text-2);font-weight:800;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
.sec span{font-size:12.5px;color:var(--text-3);font-weight:600}
.trips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.trips{grid-template-columns:1fr}}
.trip{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
.trip:hover{transform:translateY(-2px)}
.trip:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.cover{position:relative;height:132px;display:flex;align-items:center;justify-content:center;font-size:64px}
.cover .no{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.85);color:#1d1b19;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.cover .st{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#1f2f4d;color:#fff}
.cover .st.done{background:#2f7d4f}
.cover .st.now{background:#c8452f}
.tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.tt{font-size:19px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:13.5px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tags span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.open{margin-top:6px;font-size:13.5px;font-weight:800;color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;color:var(--text-3);font-size:14px}
.empty .e{font-size:32px;display:block;margin-bottom:6px}
.foot{margin-top:32px;color:var(--text-3);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">FAMILY TRIP</div>
    <h1>가족여행 🧳</h1>
    <p>엄마 · 아빠 · 나, 우리 가족이 함께 떠나는 여행 모음</p>
    <div class="faces" aria-hidden="true">👨👩👧</div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="화면 테마 전환">🌓</button>
  </header>

  <a class="next" id="nextTrip" hidden></a>

  <h2 class="sec">✈️ 다가오는 여행 <span id="upCount"></span></h2>
  <div class="trips" id="upcoming"></div>

  <h2 class="sec">📸 다녀온 여행 <span id="pastCount"></span></h2>
  <div class="trips" id="past"></div>

  <p class="foot">각 여행편을 눌러 일정·동선·예산·준비물을 확인하세요. 한 번 열어둔 여행편은 데이터 없이도 열려요.</p>
</div>

<script>
/* ---------- 여행편 목록 ----------
   새 여행을 추가할 때: 폴더(예: jeju/)를 만들고 아래에 한 줄 추가 + sw.js의 TRIPS에 폴더 이름 추가 */
const TRIPS = [
  {no:1, path:'fukuoka/', title:'후쿠오카 여행편', emoji:'🍜', place:'🇯🇵 일본 후쿠오카', start:'2026-12-26', end:'2026-12-29',
   members:'엄마 · 아빠 · 나', cover:['#ffe3d6','#ffd0bf'], tags:['하츠키 와규','다자이후','오호리 공원','모츠나베','아마오우 파르페']},
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const DOW = ['일','월','화','수','목','금','토'];
const fmt = s => { const d = day(s); return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`; };

function status(t){
  const s = day(t.start), e = day(t.end);
  const nights = Math.round((e - s) / 86400000);
  const label = `${nights}박 ${nights+1}일`;
  if (today < s) { const n = Math.round((s - today) / 86400000); return {k:'up', chip:`D-${n}`, n, label}; }
  if (today <= e) { const n = Math.round((today - s) / 86400000) + 1; return {k:'now', chip:`여행 중 · ${n}일차`, n:0, label}; }
  return {k:'done', chip:'다녀왔어요', n:Infinity, label};
}
function card(t){
  const st = status(t);
  return `<a class="trip" href="${esc(t.path)}">
    <div class="cover" style="background:linear-gradient(135deg,${t.cover[0]},${t.cover[1]})">
      <span class="no">여행편 #${t.no}</span><span class="st ${st.k}">${st.chip}</span>
      <span aria-hidden="true">${t.emoji}</span></div>
    <div class="tb">
      <div class="tt">${esc(t.title)}</div>
      <div class="meta"><span>${esc(t.place)}</span><span>${fmt(t.start)} – ${fmt(t.end)} · ${st.label}</span><span>${esc(t.members)}</span></div>
      <div class="tags">${t.tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
      <div class="open">일정 보러 가기 →</div>
    </div></a>`;
}
const list = TRIPS.map(t => ({t, st:status(t)}));
const up = list.filter(x => x.st.k !== 'done').sort((a,b) => day(a.t.start) - day(b.t.start));
const past = list.filter(x => x.st.k === 'done').sort((a,b) => day(b.t.start) - day(a.t.start));
$('#upcoming').innerHTML = up.length ? up.map(x=>card(x.t)).join('') : '<div class="empty"><span class="e">🗺️</span>다음 여행을 계획하면 여기에 생겨요</div>';
$('#past').innerHTML = past.length ? past.map(x=>card(x.t)).join('') : '<div class="empty"><span class="e">📸</span>첫 여행이 끝나면 여기에 모여요</div>';
$('#upCount').textContent = up.length ? `${up.length}개` : '';
$('#pastCount').textContent = past.length ? `${past.length}개` : '';
if (up.length){
  const n = up[0], st = n.st;
  const el = $('#nextTrip'); el.hidden = false; el.href = n.t.path;
  el.innerHTML = `<span class="big">${st.k==='now' ? '🧳' : st.chip}</span><span class="t"><b>${st.k==='now' ? '지금 여행 중이에요' : '다음 여행까지'}</b>${esc(n.t.title)} · ${fmt(n.t.start)} 출발</span><span class="go">→</span>`;
}

/* 테마 (여행편 페이지와 같은 설정을 써요) */
try { const t = JSON.parse(localStorage.getItem('fuk26:theme')); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('fuk26:theme', JSON.stringify(next)); } catch(e) {}
};

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
